apiVersion: v1
kind: Namespace
metadata:
  name: phase-iv-frontend
---
apiVersion: v1
kind: Secret
metadata:
  name: nextjs-secrets
  namespace: phase-iv-frontend
type: Opaque
stringData:
  BETTER_AUTH_SECRET: "your-secret-here"
  DATABASE_URL: "postgresql://user:pass@host:5432/db"
  QDRANT_API_KEY: "your-qdrant-key"
  GEMINI_API_KEY: "your-gemini-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextjs-config
  namespace: phase-iv-frontend
data:
  QDRANT_URL: "https://your-qdrant-instance.cloud.qdrant.io"
  QDRANT_COLLECTION: "your-collection"
  EMBEDDING_PROVIDER: "gemini"
  EMBEDDING_MODEL: "text-embedding-004"
  NEXT_PUBLIC_API_URL: "http://api-service:8000"
  BETTER_AUTH_URL: "https://your-domain.com"
  NODE_ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-app
  namespace: phase-iv-frontend
  labels:
    app: nextjs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: nextjs
        image: phase_iv-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        envFrom:
        - configMapRef:
            name: nextjs-config
        - secretRef:
            name: nextjs-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-service
  namespace: phase-iv-frontend
  labels:
    app: nextjs
spec:
  type: ClusterIP
  selector:
    app: nextjs
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextjs-ingress
  namespace: phase-iv-frontend
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - your-domain.com
    secretName: nextjs-tls
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nextjs-service
            port:
              number: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nextjs-hpa
  namespace: phase-iv-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nextjs-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
